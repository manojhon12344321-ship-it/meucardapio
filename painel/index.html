<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Painel - Garçom NFC</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Space Grotesk;background:#080808;color:white}</style></head>
<body>
<div id="login" class="min-h-screen flex items-center justify-center p-4"><div class="bg-[#161616] border border-white/10 rounded-3xl p-8 max-w-sm w-full"><h2 class="text-2xl font-black">🔒 Painel do Restaurante</h2><input id="email" class="w-full mt-4 bg-black border border-white/10 p-3 rounded-xl" placeholder="E-mail" value="dono@pizzaria.com"><input id="senha" type="password" class="w-full mt-3 bg-black border border-white/10 p-3 rounded-xl" placeholder="Senha" value="123456"><button id="btnLogin" class="w-full mt-4 bg-yellow-400 text-black py-3 rounded-xl font-black">Entrar no Painel</button><p class="text-[10px] text-gray-500 mt-3">Demo: clique que entra direto</p></div></div>
<div id="panel" class="hidden"><header class="flex justify-between p-4 border-b border-white/10 sticky top-0 bg-[#080808] z-20"><h1 class="font-black">🍔 Painel - Garçom NFC</h1><div class="flex gap-2"><a href="../" class="bg-white/10 px-3 py-1 rounded-full text-xs">Site</a><button onclick="location.reload()" class="bg-red-500/20 text-red-400 px-3 py-1 rounded-full text-xs">Sair</button></div></header>
<div class="p-4 grid md:grid-cols-3 gap-4"><div class="md:col-span-2 bg-[#161616] border border-white/10 rounded-2xl p-5"><h3 class="font-black">1. Seu Restaurante</h3><div class="grid md:grid-cols-2 gap-3 mt-4"><input id="restNome" class="bg-black border border-white/10 p-3 rounded-xl" placeholder="Nome restaurante" value="Pizzaria Teixeira"><input id="restWhats" class="bg-black border border-white/10 p-3 rounded-xl" placeholder="Whats cozinha 73..." value="73999999999"><input id="restPix" class="bg-black border border-white/10 p-3 rounded-xl md:col-span-2" placeholder="Chave Pix (opcional)"></div><button onclick="salvarRest()" class="mt-4 bg-yellow-400 text-black px-6 py-3 rounded-xl font-black">Salvar Restaurante</button></div><div class="bg-[#161616] border border-yellow-400/30 rounded-2xl p-5"><h3 class="font-black">🔔 Pedidos Ao Vivo</h3><div id="pedidos" class="mt-4 space-y-2 max-h-[400px] overflow-auto text-sm"></div></div></div>
<div class="p-4 grid md:grid-cols-2 gap-4"><div class="bg-[#161616] border border-white/10 rounded-2xl p-5"><h3 class="font-black">2. Cardápio - Add Prato</h3><div class="grid gap-3 mt-4"><input id="pratoNome" class="bg-black border border-white/10 p-3 rounded-xl" placeholder="Nome prato *"><div class="grid grid-cols-2 gap-3"><input id="pratoPreco" type="number" class="bg-black border border-white/10 p-3 rounded-xl" placeholder="Preço *"><input id="pratoCat" class="bg-black border border-white/10 p-3 rounded-xl" placeholder="Categoria"></div><input id="pratoFoto" type="file" class="bg-black border border-white/10 p-3 rounded-xl text-xs"></div><button onclick="addPrato()" class="w-full mt-4 bg-white text-black py-3 rounded-xl font-black">+ Adicionar Prato</button><div id="listaPratos" class="mt-4 space-y-2"></div></div><div class="bg-[#161616] border border-white/10 rounded-2xl p-5"><h3 class="font-black">3. Mesas - Gerar Tags NFC</h3><p class="text-xs text-gray-400 mt-1">Cada mesa gera link único pra gravar na tag com NFC Tools</p><div class="flex gap-3 mt-4"><input id="qtdMesas" type="number" value="10" class="bg-black border border-white/10 p-3 rounded-xl w-20"><button onclick="gerarMesas()" class="flex-1 bg-yellow-400 text-black py-3 rounded-xl font-black">Gerar Mesas + Links NFC</button></div><div id="listaMesas" class="mt-4 grid gap-2"></div></div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, query, where, onSnapshot, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyBBnA9orBCf3j1_3nRHWcIctLe7aKMgcI8", authDomain: "mapapet-ad359.firebaseapp.com", projectId: "mapapet-ad359", storageBucket: "mapapet-ad359.firebasestorage.app", messagingSenderId: "268931015194", appId: "1:268931015194:web:5ae634751c3be46ebe67a3" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
let click=0;
document.getElementById('btnLogin').addEventListener('click',()=>{ document.getElementById('login').classList.add('hidden'); document.getElementById('panel').classList.remove('hidden'); load(); });
function gid(){return Math.random().toString(36).substring(2,6).toUpperCase();}
async function load(){ const q = query(collection(db,'pedidos_nfc'), where('restaurante','==', document.getElementById('restNome').value||'Pizzaria Teixeira')); onSnapshot(q, snap=>{ const div=document.getElementById('pedidos'); div.innerHTML=''; snap.forEach(d=>{ const p=d.data(); const el=document.createElement('div'); el.className='bg-black border border-white/10 rounded-xl p-3'; el.innerHTML=`<p class="font-black">${p.mesa? 'MESA '+p.mesa : ''} ${p.tipo==='chamar_garcom'?'🔔 CHAMAR':''}</p><p class="text-xs text-gray-400">${p.itens? p.itens.map(i=>i.nome).join(', ') : ''} ${p.total? '- R$ '+p.total : ''}</p>`; div.prepend(el); }); }); loadPratos(); loadMesas(); }
window.salvarRest=async()=>{ const nome=document.getElementById('restNome').value; const whats=document.getElementById('restWhats').value; const pix=document.getElementById('restPix').value; if(!nome) return alert('Nome'); await addDoc(collection(db,'restaurantes_nfc'),{ nome, whats, pix, criadoEm:serverTimestamp() }); alert('Salvo! Agora gera as mesas.'); }
let fotoBase64=''; document.getElementById('pratoFoto')?.addEventListener('change', e=>{ const r=new FileReader(); r.onload=ev=>{ fotoBase64=ev.target.result; }; r.readAsDataURL(e.target.files[0]); });
window.addPrato=async()=>{ const nome=document.getElementById('pratoNome').value; const preco=parseFloat(document.getElementById('pratoPreco').value); const cat=document.getElementById('pratoCat').value; if(!nome||!preco) return alert('Nome e preço'); await addDoc(collection(db,'cardapio_nfc'),{ restauranteId:document.getElementById('restNome').value, nome, preco, categoria:cat||'Geral', foto:fotoBase64, ativo:true, criadoEm:serverTimestamp() }); document.getElementById('pratoNome').value=''; document.getElementById('pratoPreco').value=''; alert('Prato adicionado!'); loadPratos(); }
async function loadPratos(){ const q=query(collection(db,'cardapio_nfc'), where('restauranteId','==', document.getElementById('restNome').value)); const snap=await getDocs(q); const div=document.getElementById('listaPratos'); div.innerHTML=''; snap.forEach(d=>{ const p=d.data(); const el=document.createElement('div'); el.className='bg-black border border-white/10 rounded-xl p-3 flex justify-between'; el.innerHTML=`<div><p class="font-bold text-sm">${p.nome}</p><p class="text-xs text-yellow-400">R$ ${p.preco}</p></div><p class="text-xs text-gray-400">${p.categoria}</p>`; div.appendChild(el); }); }
window.gerarMesas=async()=>{ const qtd=parseInt(document.getElementById('qtdMesas').value)||10; const restNome=document.getElementById('restNome').value; const whats=document.getElementById('restWhats').value; for(let i=1;i<=qtd;i++){ const shortId=restNome.substring(0,3).toUpperCase()+'-MESA'+i+'-'+gid(); await addDoc(collection(db,'mesas_nfc'),{ restaurante:restNome, numero:i, shortId, restauranteId:restNome, whats, criadoEm:serverTimestamp() }); } alert(qtd+' mesas geradas!'); loadMesas(); }
async function loadMesas(){ const q=query(collection(db,'mesas_nfc'), where('restaurante','==', document.getElementById('restNome').value)); const snap=await getDocs(q); const div=document.getElementById('listaMesas'); div.innerHTML=''; snap.forEach(d=>{ const m=d.data(); const link=`https://mapapet-ad359.web.app/m/?sid=${m.shortId}`; const el=document.createElement('div'); el.className='bg-black border border-white/10 rounded-xl p-3 flex justify-between items-center'; el.innerHTML=`<div><p class="font-black text-sm">MESA ${m.numero}</p><p class="text-[10px] text-cyan-400 break-all">${link}</p></div><button onclick="navigator.clipboard.writeText('${link}');alert('Link NFC copiado!')" class="bg-white/10 px-3 py-1 rounded-full text-xs">Copiar</button>`; div.appendChild(el); }); }
</script>
</body></html>
