<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Dono - Meu Cardápio NFC</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>body{font-family:'Space Grotesk',sans-serif;background:#080808;color:white}</style>
</head>
<body>

<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-[#161616] border border-white/10 rounded-3xl p-8 max-w-sm w-full">
    <h2 class="text-2xl font-black">🔒 Painel do Dono</h2><p class="text-xs text-gray-400 mt-2">Meu Cardápio NFC</p>
    <input id="email" class="w-full mt-5 bg-black border border-white/10 p-3 rounded-xl text-sm" placeholder="E-mail do restaurante" value="dono@pizzaria.com">
    <input id="senha" type="password" class="w-full mt-3 bg-black border border-white/10 p-3 rounded-xl text-sm" placeholder="Senha" value="123456">
    <button id="btnLogin" class="w-full mt-5 bg-yellow-400 text-black py-3 rounded-xl font-black text-sm">Entrar no Painel</button>
    <p class="text-[10px] text-gray-500 mt-3 text-center">Demo: clique para entrar</p>
  </div>
</div>

<div id="panel" class="hidden">
  <header class="flex justify-between p-4 border-b border-white/10 sticky top-0 bg-[#080808] z-20">
    <h1 class="font-black">🍔 Meu Cardápio - Painel</h1>
    <div class="flex gap-2"><a href="../" class="bg-white/10 px-3 py-1 rounded-full text-xs">Ver Site</a><button onclick="location.reload()" class="bg-red-500/20 text-red-400 px-3 py-1 rounded-full text-xs">Sair</button></div>
  </header>

  <div class="p-4 grid md:grid-cols-3 gap-4">
    <div class="md:col-span-2 bg-[#161616] border border-white/10 rounded-2xl p-5">
      <h3 class="font-black">1. Seu Restaurante</h3>
      <div class="grid md:grid-cols-2 gap-3 mt-4">
        <input id="restNome" class="bg-black border border-white/10 p-3 rounded-xl text-sm" placeholder="Nome restaurante *" value="Pizzaria Teixeira">
        <input id="restWhats" class="bg-black border border-white/10 p-3 rounded-xl text-sm" placeholder="Whats da cozinha 73..." value="73999999999">
        <input id="restPix" class="bg-black border border-white/10 p-3 rounded-xl text-sm md:col-span-2" placeholder="Chave Pix (opcional)">
      </div>
      <button onclick="salvarRest()" class="mt-4 bg-yellow-400 text-black px-6 py-3 rounded-xl font-black text-sm">Salvar Restaurante</button>
    </div>
    <div class="bg-[#161616] border border-yellow-400/30 rounded-2xl p-5">
      <h3 class="font-black text-sm">🔔 Pedidos Ao Vivo</h3><p class="text-[10px] text-gray-400">Atualiza automático</p>
      <div id="pedidos" class="mt-4 space-y-2 max-h-[400px] overflow-auto text-sm"><p class="text-xs text-gray-500">Nenhum pedido ainda</p></div>
    </div>
  </div>

  <div class="p-4 grid md:grid-cols-2 gap-4">
    <div class="bg-[#161616] border border-white/10 rounded-2xl p-5">
      <h3 class="font-black">2. Cardápio - Adicionar Prato</h3>
      <div class="grid gap-3 mt-4">
        <input id="pratoNome" class="bg-black border border-white/10 p-3 rounded-xl text-sm" placeholder="Nome do prato *">
        <div class="grid grid-cols-2 gap-3">
          <input id="pratoPreco" type="number" step="0.01" class="bg-black border border-white/10 p-3 rounded-xl text-sm" placeholder="Preço *">
          <input id="pratoCat" class="bg-black border border-white/10 p-3 rounded-xl text-sm" placeholder="Categoria (Lanches)">
        </div>
        <input id="pratoDesc" class="bg-black border border-white/10 p-3 rounded-xl text-sm" placeholder="Descrição curta">
        <input id="pratoFoto" type="file" accept="image/*" class="bg-black border border-white/10 p-3 rounded-xl text-xs">
      </div>
      <button onclick="addPrato()" class="w-full mt-4 bg-white text-black py-3 rounded-xl font-black text-sm">+ Adicionar Prato</button>
      <div id="listaPratos" class="mt-4 space-y-2"></div>
    </div>
    <div class="bg-[#161616] border border-white/10 rounded-2xl p-5">
      <h3 class="font-black">3. Mesas - Gerar Links NFC</h3><p class="text-[11px] text-gray-400 mt-1">Cada mesa gera link único. Grava na tag com app NFC Tools</p>
      <div class="flex gap-3 mt-4">
        <input id="qtdMesas" type="number" value="10" class="bg-black border border-white/10 p-3 rounded-xl w-20 text-sm">
        <button onclick="gerarMesas()" class="flex-1 bg-yellow-400 text-black py-3 rounded-xl font-black text-sm">Gerar Mesas + Links NFC</button>
      </div>
      <div id="listaMesas" class="mt-4 grid gap-2 max-h-[500px] overflow-auto"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, query, where, onSnapshot, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBBnA9orBCf3j1_3nRHWcIctLe7aKMgcI8",
  authDomain: "mapapet-ad359.firebaseapp.com",
  projectId: "mapapet-ad359",
  storageBucket: "mapapet-ad359.firebasestorage.app",
  messagingSenderId: "268931015194",
  appId: "1:268931015194:web:5ae634751c3be46ebe67a3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById('btnLogin').addEventListener('click', () => {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');
  load();
});

function gid(){ return Math.random().toString(36).substring(2,6).toUpperCase(); }

async function load(){
  const nome = document.getElementById('restNome').value;
  const q = query(collection(db,'pedidos_nfc'), where('restaurante','==', nome));
  onSnapshot(q, snap => {
    const div = document.getElementById('pedidos');
    if(snap.empty){ div.innerHTML = '<p class="text-xs text-gray-500">Aguardando pedidos...</p>'; return; }
    div.innerHTML = '';
    snap.forEach(d => {
      const p = d.data();
      const el = document.createElement('div');
      el.className = 'bg-black border border-white/10 rounded-xl p-3';
      const isChamar = p.tipo === 'chamar_garcom';
      el.innerHTML = `<p class="font-black text-xs">${p.mesa ? 'MESA '+p.mesa : ''} ${isChamar ? '🔔 CHAMAR GARÇOM' : ''}</p><p class="text-[11px] text-gray-400 mt-1">${p.itens ? p.itens.map(i=>i.nome).join(', ') : ''} ${p.total ? '- R$ '+p.total : ''}</p><p class="text-[9px] text-gray-500 mt-1">${p.obs || ''}</p>`;
      div.prepend(el);
    });
  });
  loadPratos();
  loadMesas();
}

window.salvarRest = async () => {
  const nome = document.getElementById('restNome').value.trim();
  const whats = document.getElementById('restWhats').value.trim();
  const pix = document.getElementById('restPix').value.trim();
  if(!nome){ alert('Digite o nome do restaurante'); return; }
  await addDoc(collection(db,'restaurantes_nfc'),{ nome, whats, pix, criadoEm:serverTimestamp() });
  alert('Restaurante salvo! Agora gere as mesas.');
};

let fotoBase64 = '';
document.getElementById('pratoFoto').addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => { fotoBase64 = ev.target.result; };
  reader.readAsDataURL(file);
});

window.addPrato = async () => {
  const nome = document.getElementById('pratoNome').value.trim();
  const preco = parseFloat(document.getElementById('pratoPreco').value);
  const cat = document.getElementById('pratoCat').value.trim() || 'Geral';
  const desc = document.getElementById('pratoDesc').value.trim();
  const restId = document.getElementById('restNome').value.trim();
  if(!nome || !preco){ alert('Preencha nome e preço'); return; }
  await addDoc(collection(db,'cardapio_nfc'),{ restauranteId: restId, nome, preco, categoria: cat, desc, foto: fotoBase64, ativo:true, criadoEm:serverTimestamp() });
  document.getElementById('pratoNome').value = '';
  document.getElementById('pratoPreco').value = '';
  document.getElementById('pratoDesc').value = '';
  fotoBase64 = '';
  alert('Prato adicionado!');
  loadPratos();
};

async function loadPratos(){
  const restId = document.getElementById('restNome').value.trim();
  const q = query(collection(db,'cardapio_nfc'), where('restauranteId','==', restId));
  const snap = await getDocs(q);
  const div = document.getElementById('listaPratos');
  div.innerHTML = '';
  snap.forEach(d => {
    const p = d.data();
    const el = document.createElement('div');
    el.className = 'bg-black border border-white/10 rounded-xl p-3 flex justify-between items-center';
    el.innerHTML = `<div><p class="font-bold text-xs">${p.nome}</p><p class="text-[11px] text-yellow-400">R$ ${Number(p.preco).toFixed(2)} • ${p.categoria}</p></div>`;
    div.appendChild(el);
  });
}

window.gerarMesas = async () => {
  const qtd = parseInt(document.getElementById('qtdMesas').value) || 10;
  const restNome = document.getElementById('restNome').value.trim();
  const whats = document.getElementById('restWhats').value.trim();
  if(!restNome){ alert('Salve o restaurante primeiro'); return; }
  for(let i=1; i<=qtd; i++){
    const shortId = restNome.substring(0,3).toUpperCase() + '-MESA' + i + '-' + gid();
    await addDoc(collection(db,'mesas_nfc'),{ restaurante: restNome, numero: i, shortId, restauranteId: restNome, whats, criadoEm: serverTimestamp() });
  }
  alert(qtd + ' mesas geradas com sucesso!');
  loadMesas();
};

async function loadMesas(){
  const restNome = document.getElementById('restNome').value.trim();
  const q = query(collection(db,'mesas_nfc'), where('restaurante','==', restNome));
  const snap = await getDocs(q);
  const div = document.getElementById('listaMesas');
  div.innerHTML = '';
  snap.forEach(d => {
    const m = d.data();
    const baseUrl = window.location.origin;
    const link = baseUrl + '/m/?sid=' + m.shortId;
    const el = document.createElement('div');
    el.className = 'bg-black border border-white/10 rounded-xl p-3';
    el.innerHTML = `<div class="flex justify-between items-start"><div class="flex-1"><p class="font-black text-xs">MESA ${m.numero}</p><p class="text-[10px] text-cyan-400 break-all mt-1">${link}</p><p class="text-[9px] text-gray-500 mt-1">ID NFC: ${m.shortId}</p></div><button onclick="navigator.clipboard.writeText('${link}');alert('Link copiado! Cole no NFC Tools')" class="bg-white/10 hover:bg-white/20 px-3 py-2 rounded-full text-[10px] font-bold ml-2">Copiar</button></div>`;
    div.appendChild(el);
  });
}
</script>
</body>
</html>
