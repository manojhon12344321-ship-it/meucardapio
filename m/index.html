<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cardápio Mesa</title><script src="https://cdn.tailwindcss.com"></script><link rel="manifest" href="/manifest.json"><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js',{scope:'/'})}</script></head>
<body class="bg-[#FFF8F0]">
<div class="max-w-md mx-auto bg-white min-h-screen pb-[150px]">
<div class="bg-black text-white p-4 flex justify-between sticky top-0 z-10"><div><h1 class="font-black">BURGER HOUSE</h1><p id="mesaNome" class="bg-white text-black px-3 py-1 rounded-full text-xs font-black inline-block mt-1">MESA 1</p></div><span class="bg-green-500 px-3 py-1 rounded-full text-[10px] font-black h-fit">● ABERTO</span></div>
<div class="p-4"><div id="menu" class="grid gap-3"></div><div class="mt-6 bg-zinc-100 p-4 rounded-2xl"><p class="font-bold text-sm">Conta da Mesa <span id="mesaNumTxt"></span></p><p id="contaMesa" class="font-black text-xl">R$ 0,00 em aberto</p><p id="listaConta" class="text-xs text-zinc-500 mt-2"></p></div><button onclick="chamarGarcom()" class="w-full mt-4 bg-yellow-400 py-4 rounded-full font-black text-black text-sm">🔔 CHAMAR GARÇOM</button></div>
<div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 max-w-md mx-auto flex justify-between items-center"><div><p id="qtd" class="text-[11px] text-zinc-500">0 itens</p><p id="total" class="font-black text-xl">R$ 0,00</p></div><button id="btnVer" class="bg-black text-white px-8 py-3 rounded-full font-black text-sm">VER SACOLA</button></div>
<div id="modal" class="hidden fixed inset-0 bg-black/60 z-20 p-4 flex items-end justify-center"><div class="bg-white rounded-[28px] p-6 w-full max-w-md"><h3 class="font-black text-xl">Sua sacola</h3><div id="carrinho" class="mt-4 space-y-2 max-h-[30vh] overflow-auto"></div><input id="nome" placeholder="Seu nome *" class="w-full mt-3 bg-zinc-100 p-3 rounded-xl text-sm border"><input id="obs" placeholder="Obs: sem cebola" class="w-full mt-2 bg-zinc-100 p-3 rounded-xl text-sm border"><p id="totalModal" class="font-black text-2xl mt-3">Total: R$ 0,00</p><button id="btnEnviar" class="w-full mt-3 bg-black text-white py-4 rounded-full font-black">FAZER PEDIDO</button><button onclick="document.getElementById('modal').classList.add('hidden')" class="w-full mt-2 bg-zinc-100 py-3 rounded-full text-sm font-bold">Continuar pedindo</button></div></div>
</div>
<div id="ok" class="hidden fixed inset-0 bg-white z-30 p-8 text-center pt-20"><h2 class="text-6xl">✅</h2><h1 class="font-black text-2xl mt-3">PEDIDO ENVIADO!</h1><p class="text-sm text-zinc-500 mt-2">Já está na cozinha. Pode pedir mais na mesma mesa.</p><button onclick="location.reload()" class="mt-6 bg-black text-white px-8 py-4 rounded-full font-black w-full">PEDIR MAIS ITENS</button></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, serverTimestamp, doc, setDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBBnA9orBCf3j1_3nRHWcIctLe7aKMgcI8",authDomain:"mapapet-ad359.firebaseapp.com",projectId:"mapapet-ad359",storageBucket:"mapapet-ad359.firebasestorage.app",messagingSenderId:"268931015194",appId:"1:268931015194:web:5ae634751c3be46ebe67a3"};
const db=getFirestore(initializeApp(cfg));
const sid=new URLSearchParams(location.search).get('mesa')||new URLSearchParams(location.search).get('sid')||'1';
let mesaNumero=sid.replace(/\D/g,'')||'1';
document.getElementById('mesaNome').textContent='MESA '+mesaNumero;document.getElementById('mesaNumTxt').textContent=mesaNumero;
setDoc(doc(db,'comandas_mesas','MESA'+mesaNumero),{numero:parseInt(mesaNumero),status:'visualizando',ultimoAcesso:serverTimestamp(),abriuEm:serverTimestamp()},{merge:true});
let contaTotal=0;
onSnapshot(query(collection(db,'pedidos'),where('mesa','==',mesaNumero)), snap=>{
let total=0;let lista=[];snap.forEach(d=>{let p=d.data();if(p.status!=='entregue' && p.status!=='pago' && p.tipo!=='chamar_garcom'){total+=Number(p.total||0);(p.itens||[]).forEach(i=>lista.push(i.nome));}});contaTotal=total;document.getElementById('contaMesa').textContent='R$ '+total.toFixed(2)+' em aberto';document.getElementById('listaConta').textContent=lista.join(', ');
});
let carrinho=[];let cardapio=[];
async function load(){let snap=await getDocs(collection(db,'cardapio'));snap.forEach(d=>cardapio.push({id:d.id,...d.data()}));if(cardapio.length==0)cardapio=[{nome:'X-Bacon',preco:32,desc:'Artesanal 180g',foto:''},{nome:'Batata Frita',preco:28,desc:'400g crocante',foto:''}];document.getElementById('menu').innerHTML=cardapio.map(item=>`<div class="bg-white border rounded-2xl p-3 flex gap-3"><img src="${item.foto||'https://via.placeholder.com/100'}" class="w-16 h-16 rounded-xl object-cover bg-zinc-100"><div class="flex-1"><p class="font-black text-sm">${item.nome}</p><p class="text-[11px] text-zinc-500">${item.desc||item.categoria||''}</p><p class="font-black text-sm mt-1">R$ ${Number(item.preco).toFixed(2)}</p></div><button onclick="addItem('${item.nome.replace(/'/g,'')}',${Number(item.preco)})" class="bg-black text-white h-9 px-5 rounded-full text-sm font-black">+</button></div>`).join('');}
window.addItem=(n,p)=>{carrinho.push({nome:n,preco:p});update();};
function update(){let t=carrinho.reduce((s,i)=>s+i.preco,0);document.getElementById('total').textContent='R$ '+t.toFixed(2);document.getElementById('totalModal').textContent='Total: R$ '+t.toFixed(2);document.getElementById('qtd').textContent=carrinho.length+' itens';document.getElementById('carrinho').innerHTML=carrinho.map(i=>`<div class="flex justify-between bg-zinc-50 p-2 rounded-xl text-sm"><span>${i.nome}</span><span>R$ ${i.preco.toFixed(2)}</span></div>`).join('');}
document.getElementById('btnVer').onclick=()=>{if(carrinho.length==0)return alert('Sacola vazia');document.getElementById('modal').classList.remove('hidden');};
let enviando=false;
document.getElementById('btnEnviar').onclick=async()=>{
if(enviando)return;enviando=true;let btn=document.getElementById('btnEnviar');btn.textContent='ENVIANDO... NÃO CLIQUE DE NOVO';btn.disabled=true;
let nome=document.getElementById('nome').value.trim();if(!nome){alert('Digite nome');enviando=false;btn.textContent='FAZER PEDIDO';btn.disabled=false;return;}
let ip='';try{let r=await fetch('https://api.ipify.org?format=json');let j=await r.json();ip=j.ip;}catch(e){ip='sem-ip';}
let total=carrinho.reduce((s,i)=>s+i.preco,0);let obs=document.getElementById('obs').value;
await addDoc(collection(db,'pedidos'),{cliente:nome,mesa:mesaNumero,local:'Mesa '+mesaNumero,shortId:sid,itens:carrinho,total,obs,status:'novo',criadoEm:serverTimestamp(),ip,userAgent:navigator.userAgent,log:'Pedido '+new Date().toLocaleString()});
await setDoc(doc(db,'comandas_mesas','MESA'+mesaNumero),{numero:parseInt(mesaNumero),cliente:nome,status:'ocupada',total:contaTotal+total,ultimoAcesso:serverTimestamp(),ultimoPedido:serverTimestamp()},{merge:true});
document.getElementById('modal').classList.add('hidden');document.getElementById('ok').classList.remove('hidden');carrinho=[];update();
setTimeout(()=>{enviando=false;btn.textContent='FAZER PEDIDO';btn.disabled=false;},10000);
};
window.chamarGarcom=async()=>{let nome=document.getElementById('nome')?.value||'Mesa '+mesaNumero;await addDoc(collection(db,'pedidos'),{mesa:mesaNumero,cliente:nome,tipo:'chamar_garcom',total:0,status:'novo',criadoEm:serverTimestamp()});alert('Garçom chamado!');};
load();
</script></body></html>
