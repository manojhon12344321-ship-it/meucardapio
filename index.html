<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burger House - Cardápio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-[#FFF8F0] text-zinc-900">

<!-- TOPO -->
<header class="bg-white sticky top-0 z-30 border-b">
<div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-black text-white rounded-full flex items-center justify-center font-black">B</div>
<div><h1 class="font-black leading-none">BURGER HOUSE</h1><p class="text-[10px] text-zinc-500">ARTESANAL • DESDE 2020</p></div>
</div>
<div id="barMesa" class="hidden bg-black text-white px-3 py-1 rounded-full text-xs font-bold">MESA <span id="nMesa"></span></div>
<button id="btnCart" class="bg-orange-500 text-white px-4 py-2 rounded-full font-black text-sm">🛒 <span id="qtdCart">0</span> - R$ <span id="totTop">0,00</span></button>
</div>
</header>

<!-- BANNER -->
<div class="max-w-5xl mx-auto px-4 mt-4">
<div class="bg-black rounded-[24px] p-6 md:p-8 text-white flex justify-between items-center overflow-hidden relative">
<div class="z-10"><h2 class="text-3xl md:text-4xl font-black leading-none">O MELHOR<br><span class="text-orange-400">BURGER</span><br>DA CIDADE</h2><p class="text-xs text-zinc-400 mt-2">Entrega em até 30 min • Aberto até 23h</p></div>
<div class="text-[80px] md:text-[120px] absolute right-2 md:right-8 opacity-20">🍔</div>
</div>
</div>

<!-- CATEGORIAS -->
<div class="max-w-5xl mx-auto px-4 mt-6 flex gap-2 overflow-auto">
<button onclick="filtro('todos')" class="cat bg-black text-white px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap">Todos</button>
<button onclick="filtro('burguer')" class="cat bg-white border px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap">🍔 Burgers</button>
<button onclick="filtro('porcao')" class="cat bg-white border px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap">🍟 Porções</button>
<button onclick="filtro('bebida')" class="cat bg-white border px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap">🥤 Bebidas</button>
</div>

<!-- CARDÁPIO -->
<div id="menu" class="max-w-5xl mx-auto px-4 mt-6 grid grid-cols-1 md:grid-cols-2 gap-4 pb-32"></div>

<!-- CARRINHO LATERAL -->
<div id="cartModal" class="hidden fixed inset-0 z-50 bg-black/50">
<div class="absolute right-0 top-0 h-full w-full max-w-sm bg-white p-5 overflow-auto flex flex-col">
<div class="flex justify-between items-center"><h3 class="font-black text-lg">Sua sacola <span id="sMesa" class="text-orange-500"></span></h3><button onclick="document.getElementById('cartModal').classList.add('hidden')" class="w-8 h-8 bg-zinc-100 rounded-full">✕</button></div>
<div id="cartLista" class="mt-4 space-y-3 flex-1"></div>
<div class="border-t pt-4 mt-4">
<input id="nome" placeholder="Seu nome" class="w-full bg-zinc-100 p-3 rounded-xl text-sm border">
<input id="local" placeholder="Mesa ou Endereço com número" class="w-full mt-2 bg-zinc-100 p-3 rounded-xl text-sm border">
<textarea id="obsGeral" placeholder="Observação geral (opcional)" class="w-full mt-2 bg-zinc-100 p-3 rounded-xl text-sm border"></textarea>
<div class="flex justify-between font-black mt-4"><span>Total</span><span id="totCart">R$ 0,00</span></div>
<button onclick="finalizar()" class="w-full mt-3 bg-black text-white py-4 rounded-full font-black">FINALIZAR PEDIDO</button>
</div>
</div>
</div>

<!-- MODAL PRODUTO -->
<div id="prodModal" class="hidden fixed inset-0 z-50 bg-black/60 p-4 flex items-end md:items-center justify-center">
<div class="bg-white w-full max-w-md rounded-[24px] p-6 max-h-[85vh] overflow-auto">
<div class="flex justify-between"><h3 id="pNome" class="font-black text-xl"></h3><button onclick="document.getElementById('prodModal').classList.add('hidden')" class="bg-zinc-100 w-8 h-8 rounded-full">✕</button></div>
<p id="pDesc" class="text-sm text-zinc-500 mt-1"></p>
<div id="pImg" class="text-6xl my-3 text-center">🍔</div>
<p class="font-bold text-sm mt-4">Adicionais</p>
<div id="pAds" class="mt-2 space-y-2"></div>
<textarea id="pObs" placeholder="Obs: tirar cebola, ponto da carne..." class="w-full mt-4 bg-zinc-100 p-3 rounded-xl text-sm"></textarea>
<div class="flex justify-between items-center mt-4"><span id="pPreco" class="font-black text-xl"></span><button id="pAddBtn" class="bg-black text-white px-8 py-3 rounded-full font-black">Adicionar</button></div>
</div>
</div>

<div id="okModal" class="hidden fixed inset-0 z-50 bg-white p-8 text-center pt-20">
<h2 class="text-4xl">✅</h2><h1 class="font-black text-3xl mt-2">PEDIDO ENVIADO!</h1><p id="okTexto" class="text-zinc-500 mt-2"></p><p id="okId" class="font-mono bg-zinc-100 inline-block px-3 py-1 rounded-full mt-3"></p>
<div id="okStatusBox" class="mt-6 bg-zinc-50 p-4 rounded-2xl"><p class="text-xs text-zinc-400">STATUS</p><p id="okStatus" class="font-black text-lg">NOVO</p><p id="okTempo" class="text-orange-600 font-bold"></p></div>
<button onclick="location.reload()" class="mt-8 bg-black text-white px-8 py-3 rounded-full font-black w-full max-w-sm">FAZER NOVO PEDIDO</button>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getFirestore,collection,onSnapshot,addDoc,doc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBBnA9orBCf3j1_3nRHWcIctLe7aKMgcI8",authDomain:"mapapet-ad359.firebaseapp.com",projectId:"mapapet-ad359",storageBucket:"mapapet-ad359.firebasestorage.app",messagingSenderId:"268931015194",appId:"1:268931015194:web:5ae634751c3be46ebe67a3"};
const db=getFirestore(initializeApp(cfg));

const mesaParam=new URLSearchParams(location.search).get('mesa');
if(mesaParam){document.getElementById('barMesa').classList.remove('hidden');document.getElementById('nMesa').textContent=mesaParam;document.getElementById('sMesa').textContent='MESA '+mesaParam;document.getElementById('local').value='Mesa '+mesaParam;}

let MENU_BASE=[
{ id:'1', nome:'X-Burger Clássico', preco:28.90, desc:'Pão brioche, blend 180g, queijo cheddar, maionese da casa', cat:'burguer', emoji:'🍔', adicionais:[{nome:'Bacon extra',preco:5},{nome:'Cheddar extra',preco:4},{nome:'Ovo',preco:3}] },
{ id:'2', nome:'X-Bacon Smash', preco:38.90, desc:'2x smash 100g, bacon crocante, cheddar duplo, picles', cat:'burguer', emoji:'🥓', adicionais:[{nome:'Bacon extra',preco:5},{nome:'Maionese verde',preco:2}] },
{ id:'3', nome:'Burger Duplo', preco:44.90, desc:'2x 180g, queijo, alface, tomate, cebola roxa', cat:'burguer', emoji:'🍔', adicionais:[{nome:'Bacon',preco:5}] },
{ id:'4', nome:'Batata Frita P', preco:18.00, desc:'Batata crocante 200g com páprica', cat:'porcao', emoji:'🍟', adicionais:[{nome:'Cheddar + Bacon',preco:8}] },
{ id:'5', nome:'Batata com Cheddar', preco:28.00, desc:'300g com muito cheddar e bacon', cat:'porcao', emoji:'🍟', adicionais:[] },
{ id:'6', nome:'Coca Lata', preco:6.00, desc:'350ml gelada', cat:'bebida', emoji:'🥤', adicionais:[] },
{ id:'7', nome:'Milkshake', preco:16.00, desc:'Chocolate, morango ou ovomaltine', cat:'bebida', emoji:'🥤', adicionais:[] },
];

let menu=[];let car=[];let sel=null;let selAds=[];let filtroAtual='todos';

function renderMenu(){
 let lista=menu.length?menu:MENU_BASE;
 if(filtroAtual!='todos') lista=lista.filter(m=>m.cat==filtroAtual);
 document.getElementById('menu').innerHTML=lista.map(m=>`
  <div class="bg-white p-4 rounded-[20px] border flex gap-4 items-center">
    <div class="w-16 h-16 bg-zinc-100 rounded-2xl flex items-center justify-center text-3xl">${m.emoji||'🍔'}</div>
    <div class="flex-1"><h3 class="font-black text-[15px]">${m.nome}</h3><p class="text-[11px] text-zinc-500 leading-tight mt-1">${m.desc}</p><p class="font-black mt-2">R$ ${m.preco.toFixed(2)}</p></div>
    <button onclick="abrirProd('${m.id}')" class="w-10 h-10 bg-black text-white rounded-full font-black text-xl">+</button>
  </div>`).join('');
}
renderMenu();

onSnapshot(collection(db,'cardapio'),s=>{
 if(s.empty) return;
 menu=[];s.forEach(d=>menu.push({id:d.id,...d.data()}));renderMenu();
});

window.filtro=(c)=>{filtroAtual=c;document.querySelectorAll('.cat').forEach(b=>b.className='cat bg-white border px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap');event.target.className='cat bg-black text-white px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap';renderMenu();};

window.abrirProd=(id)=>{
 let lista=menu.length?menu:MENU_BASE;
 sel=lista.find(m=>m.id==id);selAds=[];
 document.getElementById('pNome').textContent=sel.nome;document.getElementById('pDesc').textContent=sel.desc;document.getElementById('pImg').textContent=sel.emoji||'🍔';
 document.getElementById('pObs').value='';
 document.getElementById('pAds').innerHTML=(sel.adicionais||[]).map((a,i)=>`<label class="flex justify-between items-center bg-zinc-50 p-3 rounded-xl text-sm"><span class="flex items-center gap-2"><input type="checkbox" onchange="toggleAd(${i})" class="w-4 h-4"> ${a.nome}</span><span class="font-bold text-orange-600">+R$ ${a.preco.toFixed(2)}</span></label>`).join('') || '<p class="text-xs text-zinc-400">Sem adicionais</p>';
 calcProd();document.getElementById('prodModal').classList.remove('hidden');
};
window.toggleAd=(i)=>{const ad=sel.adicionais[i];const idx=selAds.findIndex(x=>x.nome==ad.nome);if(idx>=0)selAds.splice(idx,1);else selAds.push(ad);calcProd();};
function calcProd(){let t=sel.preco+selAds.reduce((a,b)=>a+b.preco,0);document.getElementById('pPreco').textContent='R$ '+t.toFixed(2);}

document.getElementById('pAddBtn').onclick=()=>{
 let t=sel.preco+selAds.reduce((a,b)=>a+b.preco,0);
 car.push({nome:sel.nome,preco:t,adicionais:[...selAds],obs:document.getElementById('pObs').value,emoji:sel.emoji});
 updCart();document.getElementById('prodModal').classList.add('hidden');
};

function updCart(){
 let total=car.reduce((a,b)=>a+b.preco,0);
 document.getElementById('qtdCart').textContent=car.length;
 document.getElementById('totTop').textContent=total.toFixed(2);
 document.getElementById('totCart').textContent='R$ '+total.toFixed(2);
 document.getElementById('cartLista').innerHTML=car.map((c,i)=>`<div class="bg-zinc-50 p-3 rounded-xl flex justify-between"><div><p class="font-bold text-sm">${c.emoji} ${c.nome}</p><p class="text-[11px] text-zinc-500">${c.adicionais.length?'+ '+c.adicionais.map(a=>a.nome).join(', '):''} ${c.obs?'['+c.obs+']':''}</p><p class="font-black text-sm mt-1">R$ ${c.preco.toFixed(2)}</p></div><button onclick="car.splice(${i},1);updCart()" class="text-red-500 font-bold">✕</button></div>`).join('') || '<p class="text-sm text-zinc-400">Sacola vazia</p>';
}
document.getElementById('btnCart').onclick=()=>{updCart();document.getElementById('cartModal').classList.remove('hidden');};

window.finalizar=async()=>{
 try{
  const nome=document.getElementById('nome').value.trim();
  let local=document.getElementById('local').value.trim();
  if(mesaParam) local='Mesa '+mesaParam;
  if(car.length==0) return alert('Sacola vazia');
  if(!nome) return alert('Digite seu nome');
  if(!local) return alert('Digite mesa ou endereço');
  const obsGeral=document.getElementById('obsGeral').value.trim();
  const total=car.reduce((a,b)=>a+b.preco,0);
  const ref=await addDoc(collection(db,'pedidos'),{cliente:nome,local,mesa:mesaParam||null,itens:car,obsGeral,total,status:'novo',criadoEm:serverTimestamp()});
  if(mesaParam) await setDoc(doc(db,'comandas_mesas','MESA'+mesaParam),{numero:parseInt(mesaParam),cliente:nome,status:'ocupada',ultimoPedido:serverTimestamp()},{merge:true});
  document.getElementById('cartModal').classList.add('hidden');
  document.getElementById('okModal').classList.remove('hidden');
  document.getElementById('okTexto').textContent=local;
  document.getElementById('okId').textContent='#'+ref.id.slice(0,5).toUpperCase();
  onSnapshot(doc(db,'pedidos',ref.id),d=>{if(!d.exists())return;const p=d.data();document.getElementById('okStatus').textContent=p.status.toUpperCase();if(p.tempoEstimado)document.getElementById('okTempo').textContent=p.atrasado?'ATRASADO!':p.tempoRestante||'Faltam '+p.tempoEstimado+' min';});
 }catch(e){alert('Erro: '+e.message);}
};
</script>
</body>
</html>
