<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gravar NFC</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black text-white min-h-screen flex items-center justify-center p-4"><div class="bg-white text-black rounded-[28px] p-6 w-full max-w-sm text-center"><h1 class="font-black text-xl">📲 Gravar TAG NFC</h1><input id="mesaNum" type="number" placeholder="Mesa ex: 5" class="w-full mt-4 bg-zinc-100 p-4 rounded-xl text-center font-black text-2xl border"><input id="urlBase" value="seusite.com/M/?mesa=" class="w-full mt-2 bg-zinc-100 p-3 rounded-xl text-sm border"><button onclick="gravar()" class="w-full mt-4 bg-black text-white py-4 rounded-full font-black">GRAVAR NA TAG</button><p id="status" class="text-xs mt-3 text-zinc-500">Android Chrome + NFC ativo</p></div><script>
async function gravar(){let mesa=document.getElementById('mesaNum').value;let base=document.getElementById('urlBase').value;if(!mesa)return alert('Mesa');let url='https://'+base.replace('https://','')+mesa;if('NDEFReader' in window){try{const w=new NDEFReader();await w.write({records:[{recordType:"url",data:url}]});document.getElementById('status').innerHTML='✅ GRAVADO: '+url;alert('MESA '+mesa+' GRAVADA');}catch(e){document.getElementById('status').textContent='Erro: '+e.message;}}else{document.getElementById('status').innerHTML='Sem NFC. QR:<br><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(url)+'" class="mx-auto mt-2">';}}
</script></body></html>
