<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garçom</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black text-white min-h-screen"><div class="max-w-md mx-auto p-4"><h1 class="font-black text-2xl">🔔 GARÇOM AO VIVO</h1><p class="text-xs text-zinc-400 mt-1">Deixa aberto no celular do garçom</p><button onclick="ativar()" id="btnAtivar" class="w-full mt-4 bg-white text-black py-4 rounded-full font-black">ATIVAR NOTIFICAÇÕES + VIBRAÇÃO</button><div id="lista" class="mt-6 grid gap-3"></div></div><audio id="som" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=notification-sound-7062.mp3"></audio><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import { getFirestore, collection, onSnapshot, query, orderBy, limit, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBBnA9orBCf3j1_3nRHWcIctLe7aKMgcI8",authDomain:"mapapet-ad359.firebaseapp.com",projectId:"mapapet-ad359",storageBucket:"mapapet-ad359.firebasestorage.app",messagingSenderId:"268931015194",appId:"1:268931015194:web:5ae634751c3be46ebe67a3"};
const db=getFirestore(initializeApp(cfg));let ativo=false;window.ativar=async()=>{ativo=true;if(Notification && Notification.permission!=='granted'){await Notification.requestPermission();}document.getElementById('btnAtivar').textContent='✅ ATIVADO - Aguardando';document.getElementById('btnAtivar').className='w-full mt-4 bg-green-500 text-white py-4 rounded-full font-black';if(navigator.vibrate)navigator.vibrate(200);};
onSnapshot(query(collection(db,'pedidos'),orderBy('criadoEm','desc'),limit(30)), snap=>{snap.docChanges().forEach(ch=>{if(ch.type==='added' && ativo){let p=ch.doc.data();if(p.tipo==='chamar_garcom' || p.status==='pronto' || p.status==='novo'){document.getElementById('som').play();if(navigator.vibrate)navigator.vibrate([300,100,300]);if(Notification.permission==='granted'){new Notification(p.tipo==='chamar_garcom'?`🔔 MESA ${p.mesa} CHAMOU`:`NOVO MESA ${p.mesa}`,{body:`${p.cliente||''}`});}}});let html='';snap.forEach(d=>{let p={id:d.id,...d.data()};html+=`<div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800"><p class="font-black">${p.tipo==='chamar_garcom'?'🔔 MESA '+p.mesa+' CHAMOU GARÇOM':p.cliente+' - MESA '+p.mesa+' - '+p.status}</p><p class="text-xs mt-1">${(p.itens||[]).map(i=>i.nome).join(', ')}</p><button onclick="resolver('${p.id}')" class="w-full mt-3 bg-white text-black py-2 rounded-full text-xs font-black">ATENDIDO</button></div>`;});document.getElementById('lista').innerHTML=html;});
window.resolver=async(id)=>{await updateDoc(doc(db,'pedidos',id),{status:'atendido_garcom'});};
</script></body></html>
