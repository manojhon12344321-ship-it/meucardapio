<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cozinha KDS</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black text-white"><header class="bg-zinc-900 p-4 flex justify-between sticky top-0"><h1 class="font-black text-2xl">🔥 COZINHA KDS</h1><span class="bg-green-500 px-3 py-1 rounded-full text-xs font-black">AO VIVO</span></header><div id="lista" class="p-4 grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div><audio id="som" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=notification-sound-7062.mp3"></audio><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBBnA9orBCf3j1_3nRHWcIctLe7aKMgcI8",authDomain:"mapapet-ad359.firebaseapp.com",projectId:"mapapet-ad359",storageBucket:"mapapet-ad359.firebasestorage.app",messagingSenderId:"268931015194",appId:"1:268931015194:web:5ae634751c3be46ebe67a3"};
const db=getFirestore(initializeApp(cfg));let ultimo=0;
onSnapshot(collection(db,'pedidos'), snap=>{
let pedidos=[];snap.forEach(d=>{let p={id:d.id,...d.data()};if(p.status!=='pago' && p.status!=='entregue' && p.status!=='atendido_garcom' && p.tipo!=='chamar_garcom') pedidos.push(p);});pedidos.sort((a,b)=>(a.criadoEm?.seconds||0)-(b.criadoEm?.seconds||0));
if(pedidos.length>ultimo && ultimo>0) document.getElementById('som').play();ultimo=pedidos.length;
document.getElementById('lista').innerHTML=pedidos.map(p=>{let mins=0;if(p.criadoEm) mins=Math.floor((Date.now()/1000 - p.criadoEm.seconds)/60);let cor=mins>15?'bg-red-600 animate-pulse':mins>10?'bg-yellow-600':'bg-zinc-800';return `<div class="${cor} p-5 rounded-2xl border-2"><div class="flex justify-between"><p class="font-black text-3xl">MESA ${p.mesa}</p><span class="bg-black px-3 py-1 rounded-full text-sm">${mins} min</span></div><p class="font-bold mt-2">${p.cliente}</p><div class="mt-3 text-lg leading-7">${(p.itens||[]).map(i=>`• ${i.nome}`).join('<br>')}</div><p class="text-sm mt-2 opacity-70">${p.obs||''}</p><div class="flex gap-2 mt-4"><button onclick="upd('${p.id}','preparando')" class="flex-1 bg-yellow-400 text-black py-3 rounded-full font-black">PREPARANDO</button><button onclick="upd('${p.id}','pronto')" class="flex-1 bg-green-500 py-3 rounded-full font-black">PRONTO</button></div></div>`}).join('')||'<p class="text-zinc-500 p-4">Nenhum pedido</p>';
});
window.upd=async(id,s)=>{await updateDoc(doc(db,'pedidos',id),{status:s});};
</script></body></html>
