<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN FIX</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black text-white p-4">
<div class="max-w-4xl mx-auto">
<h1 class="text-xl font-black">ADMIN - MESA BURGER <span id="st" class="text-xs bg-green-600 px-2 py-1 rounded-full">FIX</span></h1>
<div class="grid grid-cols-3 gap-2 mt-4">
<button onclick="tab('pedidos')" class="bg-yellow-400 text-black p-3 rounded-xl font-black">📦 PEDIDOS</button>
<button onclick="tab('mesas')" class="bg-zinc-800 p-3 rounded-xl">🪑 MESAS</button>
<button onclick="tab('caixa')" class="bg-zinc-800 p-3 rounded-xl">💰 CAIXA</button>
</div>
<div id="pedidos" class="mt-4"></div>
<div id="mesas" class="hidden mt-4 grid grid-cols-2 gap-2"></div>
<div id="caixa" class="hidden mt-4"></div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getFirestore,collection,onSnapshot,doc,updateDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBBnA9orBCf3j1_3nRHWcIctLe7aKMgcI8",authDomain:"mapapet-ad359.firebaseapp.com",projectId:"mapapet-ad359",storageBucket:"mapapet-ad359.firebasestorage.app",messagingSenderId:"268931015194",appId:"1:268931015194:web:5ae634751c3be46ebe67a3"};
const app=initializeApp(cfg);const db=getFirestore(app);
window.tab=(t)=>{['pedidos','mesas','caixa'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(t).classList.remove('hidden');}
onSnapshot(collection(db,'pedidos'),s=>{
 let h='';
 s.forEach(d=>{
  const p=d.data();const id=d.id;
  h+=`<div class="bg-zinc-900 p-4 rounded-xl mb-2 border-l-4 ${p.status=='novo'?'border-red-500':'border-yellow-400'}">
  <div class="flex justify-between"><b>${p.cliente} - ${p.local}</b><span class="text-xs">${p.status}</span></div>
  <div class="text-sm text-zinc-400 mt-1">${(p.itens||[]).map(i=>`• ${i.nome} ${i.adicionais?'+'+i.adicionais.map(a=>a.nome).join(','):''} ${i.obs?'['+i.obs+']':''}`).join('<br>')}</div>
  <div class="font-black mt-1">R$ ${p.total}</div>
  <div class="flex gap-2 mt-2">
  <button onclick="mudar('${id}','preparo')" class="bg-yellow-400 text-black px-3 py-1 rounded-full text-xs font-black">Aceitar</button>
  <button onclick="mudar('${id}','pronto')" class="bg-green-600 px-3 py-1 rounded-full text-xs">Pronto</button>
  <button onclick="apagar('${id}')" class="bg-red-600 px-3 py-1 rounded-full text-xs">X</button>
  <button onclick="window.print()" class="bg-zinc-700 px-3 py-1 rounded-full text-xs">🖨️</button>
  </div></div>`;
 });
 document.getElementById('pedidos').innerHTML=h||'<p class="text-zinc-500">Nenhum pedido. Faça um teste no cliente ?mesa=1</p>';
});
onSnapshot(collection(db,'comandas_mesas'),s=>{
 let h='';
 s.forEach(d=>{
  const m=d.data();
  h+=`<div class="bg-zinc-900 p-3 rounded-xl ${m.status=='ocupada'?'border border-yellow-400':''}"><b>MESA ${m.numero||d.id}</b><br>R$ ${m.total||0}<br><span class="text-xs">${m.cliente||''}</span><br><button onclick="zerar('${d.id}')" class="mt-2 bg-red-600 px-2 py-1 rounded text-xs">Zerar</button></div>`;
 });
 document.getElementById('mesas').innerHTML=h;
});
window.mudar=async(id,st)=>{await updateDoc(doc(db,'pedidos',id),{status:st});};
window.apagar=async(id)=>{if(confirm('apagar?'))await deleteDoc(doc(db,'pedidos',id));};
window.zerar=async(id)=>{if(confirm('zerar mesa?'))await deleteDoc(doc(db,'comandas_mesas',id));};
</script></body></html>
